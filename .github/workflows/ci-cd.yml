name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm install

      - name: Run Database Migrations (SQLite Test DB)
        run: php artisan migrate --force

      - name: Run CI Suite (Linters, Type Checks & Tests)
        run: composer ci:check

      - name: Test Asset Compilation
        run: npm run build

  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Free Deployment Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          HOOK_URL="${RENDER_DEPLOY_HOOK:-$DEPLOY_HOOK_URL}"
          if [ -n "$HOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -f -X POST "$HOOK_URL"
            echo "Deployment triggered successfully!"
          else
            echo "::notice ::No deployment hook secret (RENDER_DEPLOY_HOOK or DEPLOY_HOOK_URL) configured in repository secrets. Skipping auto-deploy trigger."
            echo "To enable automated CD on push, create a free Web Service on Render (or Koyeb) and add the Deploy Hook URL as a GitHub Secret."
          fi
